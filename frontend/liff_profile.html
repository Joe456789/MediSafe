<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MediSafe 過敏資料登記</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --line-green: #06C755;
    --line-green-dark: #05a648;
    --bg: #f7f8fa;
    --card-radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: #222;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  .state-box { text-align: center; padding: 60px 16px; color: #888; }

  .card {
    background: #fff;
    border-radius: var(--card-radius);
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card h2 {
    font-size: 15px;
    color: var(--line-green-dark);
    margin: 0 0 4px 0;
  }
  .card p.hint {
    font-size: 12px;
    color: #999;
    margin: 0 0 12px 0;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--line-green); }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-primary { background: var(--line-green); color: #fff; }
  .btn-primary:active { background: var(--line-green-dark); }
  .btn-secondary { background: #f2f4f6; color: #333; }

  .status-msg {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
  }
  .status-msg.success { color: var(--line-green-dark); }
  .status-msg.error { color: #c62f28; }

  .code-box {
    text-align: center;
    background: #f2f4f6;
    border-radius: 10px;
    padding: 16px;
    margin-top: 12px;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 4px;
    color: var(--line-green-dark);
    display: none;
  }

  .slot-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .slot-buttons button { flex: 1 1 45%; padding: 10px; font-size: 14px; }
  .slot-buttons button.done { background: #e3f9ea; color: var(--line-green-dark); }
  .range-tabs { display: flex; gap: 8px; margin: 14px 0 8px; }
  .range-tabs button {
    flex: 1; padding: 6px; font-size: 13px; background: #f2f4f6; color: #555;
  }
  .range-tabs button.active { background: var(--line-green); color: #fff; }
  .dose-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 0;
    border-bottom: 1px solid #f0f0f0; font-size: 13px;
  }
  .dose-row .date { width: 70px; color: #555; flex-shrink: 0; }
  .chip { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: bold; }
  .chip.taken { background: #e3f9ea; color: var(--line-green-dark); }
  .chip.missed { background: #fdeaea; color: #c62f28; }
  .chip.upcoming { background: #f2f4f6; color: #999; }
  .dose-summary { margin-top: 10px; font-size: 13px; font-weight: bold; }
  .dose-summary.bad { color: #c62f28; }
  .dose-summary.good { color: var(--line-green-dark); }
</style>
</head>
<body>
<div class="container">
  <div id="loading" class="state-box">正在載入您的資料...</div>
  <div id="error" class="state-box" style="display:none;"></div>

  <div id="content" style="display:none;">
    <div class="card">
      <h2>💊 過敏原登記</h2>
      <p class="hint">多筆請用逗號分隔，例如：Ibuprofen, Penicillin</p>
      <label for="allergies">已知過敏藥物/成分</label>
      <input type="text" id="allergies" placeholder="例如：Ibuprofen, Penicillin" />

      <label for="medications">目前服用中的藥物（選填）</label>
      <input type="text" id="medications" placeholder="例如：Metformin, Aspirin" />

      <button class="btn-primary" id="save-btn">儲存</button>
      <div class="status-msg" id="save-status"></div>
    </div>

    <div class="card">
      <h2>📅 服藥打卡</h2>
      <p class="hint">吃完藥點對應時段的按鈕打卡；紅色代表該次漏吃，可切換天數查詢。</p>
      <div class="slot-buttons" id="slot-buttons"></div>
      <div class="status-msg" id="checkin-status"></div>
      <div class="range-tabs" id="range-tabs">
        <button data-days="7" class="active">近 7 天</button>
        <button data-days="14">近 14 天</button>
        <button data-days="30">近 30 天</button>
      </div>
      <div id="dose-list"></div>
      <div class="dose-summary" id="dose-summary"></div>
    </div>

    <div class="card">
      <h2>👨‍👩‍👧 家屬通知</h2>
      <p class="hint">產生代碼後，請家屬加本帳號好友並在對話框輸入「綁定 代碼」，之後偵測到過敏原衝突會同步通知家屬。</p>
      <button class="btn-secondary" id="code-btn">產生家屬通知代碼</button>
      <div class="code-box" id="code-box"></div>
      <div class="status-msg" id="code-status"></div>
    </div>
  </div>
</div>

<script>
// TODO: 填入你在 LINE Developers Console 建立的 LIFF ID（過敏資料登記用的那個 LIFF app）
const LIFF_ID = "2011648052-fh99Jma2";
const API_BASE = "";

let currentUserId = null;

function showError(message) {
  document.getElementById("loading").style.display = "none";
  const errorBox = document.getElementById("error");
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

function parseList(value) {
  return value
    .split(",")
    .map((s) => s.trim())
    .filter((s) => s.length > 0);
}

async function loadProfile(userId) {
  const res = await fetch(`${API_BASE}/line/profile/${encodeURIComponent(userId)}`);
  if (!res.ok) throw new Error(`讀取資料失敗（HTTP ${res.status}）`);
  return res.json();
}

async function saveProfile(userId, allergies, medications) {
  const res = await fetch(`${API_BASE}/line/profile`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId, allergies, medications }),
  });
  if (!res.ok) throw new Error(`儲存失敗（HTTP ${res.status}）`);
  return res.json();
}

async function loadDoseLog(userId, days) {
  const res = await fetch(`${API_BASE}/line/dose-log/${encodeURIComponent(userId)}?days=${days}`);
  if (!res.ok) throw new Error(`讀取打卡紀錄失敗（HTTP ${res.status}）`);
  return res.json();
}

async function checkInDose(userId, slot) {
  const res = await fetch(`${API_BASE}/line/dose-log`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId, slot }),
  });
  if (!res.ok) throw new Error(`打卡失敗（HTTP ${res.status}）`);
  return res.json();
}

const WEEKDAY_LABELS = ["日", "一", "二", "三", "四", "五", "六"];
let currentRange = 7;

function renderDose(days) {
  const today = days[days.length - 1];

  const btns = document.getElementById("slot-buttons");
  btns.innerHTML = "";
  if (today.expected.length === 0) {
    const b = document.createElement("button");
    b.className = "btn-primary";
    b.textContent = "✅ 今天已服藥";
    b.addEventListener("click", () => doCheckIn(null));
    btns.appendChild(b);
  } else {
    today.expected.forEach((slot) => {
      const done = today.taken.includes(slot);
      const b = document.createElement("button");
      b.className = done ? "btn-secondary done" : "btn-primary";
      b.textContent = (done ? "✓ " : "") + slot + (done ? " 已吃" : " 我吃了");
      b.disabled = done;
      b.addEventListener("click", () => doCheckIn(slot));
      btns.appendChild(b);
    });
  }

  const list = document.getElementById("dose-list");
  list.innerHTML = "";
  let missedTotal = 0;
  days.slice().reverse().forEach((d) => {
    const dt = new Date(d.date + "T00:00:00");
    const label = `${dt.getMonth() + 1}/${dt.getDate()}（${WEEKDAY_LABELS[dt.getDay()]}）`;
    const chips = []
      .concat(d.taken.map((s) => `<span class="chip taken">✓ ${s}</span>`))
      .concat(d.missed.map((s) => `<span class="chip missed">✗ ${s} 漏吃</span>`))
      .concat(d.upcoming.map((s) => `<span class="chip upcoming">${s} 未到</span>`));
    missedTotal += d.missed.length;
    const row = document.createElement("div");
    row.className = "dose-row";
    row.innerHTML = `<span class="date">${label}</span><span>${chips.join(" ") || "—"}</span>`;
    list.appendChild(row);
  });

  const summary = document.getElementById("dose-summary");
  if (today.expected.length === 0) {
    summary.className = "dose-summary";
    summary.textContent = "尚未設定服藥提醒，設定後即可記錄每一次是否有吃藥。";
  } else {
    summary.className = "dose-summary " + (missedTotal ? "bad" : "good");
    summary.textContent = missedTotal ? `這段期間共漏吃 ${missedTotal} 次` : "這段期間全部按時服藥，太棒了！";
  }
}

async function refreshDose() {
  const log = await loadDoseLog(currentUserId, currentRange);
  renderDose(log.days);
}

async function doCheckIn(slot) {
  try {
    await checkInDose(currentUserId, slot);
    await refreshDose();
    setStatus("checkin-status", "✅ 已記錄打卡！", false);
  } catch (err) {
    setStatus("checkin-status", err.message || "打卡時發生錯誤", true);
  }
}

async function generateFamilyCode(userId) {
  const res = await fetch(`${API_BASE}/line/family/generate-code`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId }),
  });
  if (!res.ok) throw new Error(`產生代碼失敗（HTTP ${res.status}）`);
  return res.json();
}

function setStatus(elId, message, isError) {
  const el = document.getElementById(elId);
  el.textContent = message;
  el.className = "status-msg " + (isError ? "error" : "success");
}

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    const profile = await liff.getProfile();
    currentUserId = profile.userId;

    const saved = await loadProfile(currentUserId);
    document.getElementById("allergies").value = (saved.allergies || []).join(", ");
    document.getElementById("medications").value = (saved.medications || []).join(", ");

    await refreshDose();

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";

    document.querySelectorAll("#range-tabs button").forEach((btn) => {
      btn.addEventListener("click", async () => {
        currentRange = parseInt(btn.dataset.days, 10);
        document.querySelectorAll("#range-tabs button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        await refreshDose();
      });
    });

    document.getElementById("save-btn").addEventListener("click", async () => {
      try {
        const allergies = parseList(document.getElementById("allergies").value);
        const medications = parseList(document.getElementById("medications").value);
        await saveProfile(currentUserId, allergies, medications);
        setStatus("save-status", "✅ 已儲存，之後分析藥品會自動比對這份過敏清單。", false);
      } catch (err) {
        setStatus("save-status", err.message || "儲存時發生錯誤", true);
      }
    });

    document.getElementById("code-btn").addEventListener("click", async () => {
      try {
        const result = await generateFamilyCode(currentUserId);
        const codeBox = document.getElementById("code-box");
        codeBox.textContent = result.code;
        codeBox.style.display = "block";
        setStatus("code-status", "請家屬在 10 分鐘內於對話框輸入「綁定 " + result.code + "」", false);
      } catch (err) {
        setStatus("code-status", err.message || "產生代碼時發生錯誤", true);
      }
    });
  } catch (err) {
    console.error(err);
    showError(err.message || "載入時發生錯誤，請稍後再試。");
  }
}

main();
</script>
</body>
</html>
